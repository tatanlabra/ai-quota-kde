[project]
name = "ai-quota-monitor"
version = "0.2.0"
description = "Local KDE Plasma 6 AI quota monitor for Claude Code, Codex and Gemini CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
ai-quota-monitor = "ai_quota_monitor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_quota_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
